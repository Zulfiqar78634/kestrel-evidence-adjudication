[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-evidence-adjudication"
version = "0.3.0"
description = "Evidence-first cold-chain review slice with replay; not a clinical decision system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "coverage>=7.4"]

[project.scripts]
sentinel-review = "sentinel_review.cli:main"

[tool.setuptools]
py-modules = ["kestrel"]

[tool.setuptools.packages.find]
include = ["sentinel_review*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]

[tool.mypy]
python_version = "3.10"
files = ["sentinel_review"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["sentinel_review"]
branch = true

[tool.coverage.report]
show_missing = true
