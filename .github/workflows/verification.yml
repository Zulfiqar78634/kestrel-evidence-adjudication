name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        run: python -m pip install "openpyxl>=3.1,<4" "ruff>=0.6" "mypy>=1.10" "coverage>=7.4"
      - name: Lint (blocking)
        run: ruff check sentinel_review
      - name: Type check (informational until typed models land in Step 2)
        run: mypy
        continue-on-error: true
      - name: Compile
        run: python -m compileall -q kestrel.py sentinel_review tests
      - name: Tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Legacy demo
        run: python kestrel.py --db /tmp/kestrel-demo.sqlite demo
