name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "openpyxl>=3.1,<4"
      - run: python -m compileall -q kestrel.py sentinel_review tests
      - run: python -m unittest discover -s tests -v
      - run: python kestrel.py --db /tmp/kestrel-demo.sqlite demo
