version: '3.9'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://kestrel:kestrel@db:5432/kestrel
      - JWT_SECRET=change-me-in-production
      - KCCS_WORKBOOK=/data/KCCS_Sentinel_Reference_Data_Pack.xlsx
    volumes:
      - ./data:/data:ro
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kestrel
      - POSTGRES_PASSWORD=kestrel
      - POSTGRES_DB=kestrel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
